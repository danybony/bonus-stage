name: Bug report
description: Something in the app does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.0
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 9, Android 16
  - type: markdown
    attributes:
      value: Never paste your web API key in an issue.
